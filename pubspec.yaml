name: ds_fitness
description: "DS Fitness — Sua jornada, seus resultados."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

dependencies:
  flutter:
    sdk: flutter

  # Estado, injecao de dependencia e navegacao (stack oficial — specs/07-template-blueprint)
  get: ^4.6.6

  # Persistencia local / cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Logging estruturado
  logger: ^2.5.0

  # Formatacao pt-BR (datas, numeros)
  intl: ^0.19.0
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Imagens que o app traz (pasta assets/). Dos exercicios entram so as do catalogo
  # da API (Exercicio.imagem = pasta/arquivo): o GIF e a miniatura de cada um. Para
  # incluir outro exercicio, acrescente os dois arquivos abaixo (specs/07-engenharia.md).
  assets:
    - assets/icon/icon.png
    - assets/img/backgrounds/login-gym-background.png
    # Imagens dos grupos musculares, usadas como icone
    - assets/img/muscles/
    # GIFs dos exercicios do catalogo (um por exercicio; ver docs)
    - assets/img/gifs/pectorals/barbell-bench-press.gif
    - assets/img/gifs/pectorals/barbell-incline-bench-press.gif
    - assets/img/gifs/pectorals/barbell-decline-bench-press.gif
    - assets/img/gifs/pectorals/dumbbell-fly.gif
    - assets/img/gifs/pectorals/cable-cross-over-variation.gif
    - assets/img/gifs/pectorals/lever-seated-fly.gif
    - assets/img/gifs/lats/cable-bar-lateral-pulldown.gif
    - assets/img/gifs/upper-back/barbell-bent-over-row.gif
    - assets/img/gifs/upper-back/cable-seated-row.gif
    - assets/img/gifs/lats/pull-up.gif
    - assets/img/gifs/lats/cable-straight-arm-pulldown-with-rope.gif
    - assets/img/gifs/upper-back/lever-t-bar-row.gif
