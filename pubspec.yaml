publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Estado, injecao de dependencia e navegacao (stack oficial — specs/07-template-blueprint)
  get: ^4.6.6

  # Persistencia local / cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Logging estruturado
